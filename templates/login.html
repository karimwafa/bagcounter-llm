<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Conveyor Bag Counter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: #f1f5f9;
            --foreground: #0f172a;
            --card: #ffffff;
            --border: #cbd5e1;
            --primary: #0f172a;
            --primary-foreground: #f8fafc;
            --radius: 0.75rem;
        }

        .dark {
            --background: #020202;
            --foreground: #f8fafc;
            --card: #18181b;
            --border: rgba(255, 255, 255, 0.12);
            --primary: #f8fafc;
            --primary-foreground: #020202;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--background);
            color: var(--foreground);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            transition: all 0.4s ease;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.1);
        }

        h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 0.5rem 0; letter-spacing: -0.025em; text-align: center; }
        p { font-size: 0.875rem; color: #64748b; margin: 0 0 2rem 0; text-align: center; }

        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; }
        input {
            width: 100%;
            height: 2.75rem;
            padding: 0 0.75rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: calc(var(--radius) - 0.25rem);
            color: var(--foreground);
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: var(--foreground); }

        .btn {
            width: 100%;
            height: 2.75rem;
            background-color: var(--primary);
            color: var(--primary-foreground);
            border: none;
            border-radius: calc(var(--radius) - 0.25rem);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .btn:hover { 
            opacity: 0.9; 
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
        }
        .btn:active { transform: scale(0.98); }

        .alert {
            padding: 0.75rem;
            background-color: #fef2f2;
            color: #ef4444;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .theme-toggle {
            position: absolute;
            top: 2rem;
            right: 2rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 2.5rem;
            height: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--foreground);
        }
    </style>
</head>
<body class="dark">

    <button class="theme-toggle" onclick="toggleTheme()">
        <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
    </button>

    <div class="login-card">
        <h1>Conveyor Bag Counter</h1>
        <p>Enter your credentials to access the dashboard</p>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>
    </div>

    <script>
        const svgMoon = '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>';
        const svgSun = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>';
        
        function updateThemeIcon() {
            const isDark = document.body.classList.contains('dark');
            document.getElementById('themeIcon').innerHTML = isDark ? svgSun : svgMoon;
        }

        if (localStorage.theme === 'light') document.body.classList.remove('dark');
        updateThemeIcon();

        function toggleTheme() {
            document.body.classList.toggle('dark');
            localStorage.theme = document.body.classList.contains('dark') ? 'dark' : 'light';
            updateThemeIcon();
        }
    </script>
</body>
</html>
